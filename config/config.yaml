roostoo:
  api_key: ${ROOSTOO_API_KEY}
  secret_key: ${ROOSTOO_SECRET_KEY}
  base_url: "https://mock-api.roostoo.com"

horus:
  enabled: false
  api_key: ${HORUS_API_KEY}

strategies:
  ensemble:
    technical_weight: 0.31
    llm_weight: 0.23
    baseline_weight: 0.23
    oversold_weight: 0.23
  
  technical:
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bb_period: 20
    bb_std: 2
  
  llm:
    provider: "openrouter"  # or "openai" / "anthropic"
    model: "microsoft/mai-ds-r1:free"
    enabled: true  # Set to false to disable LLM strategy
    cache_responses: true
    max_tokens: 200
    api_key: ${OPENROUTER_API_KEY}  # or ${OPENAI_API_KEY} / ${ANTHROPIC_API_KEY}
    base_url: "https://openrouter.ai/api/v1"
    default_headers:
      HTTP-Referer: ${OPENROUTER_HTTP_REFERER}  # Replace with your app URL (required by OpenRouter)
      X-Title: ${OPENROUTER_X_TITLE}            # Replace with your app name (required by OpenRouter)
    trigger_confidence: 0.7       # Only call LLM when technical confidence exceeds this
    require_divergence: true      # Require technical/baseline divergence before calling LLM
    max_calls_per_day: 2          # LLM call cap per coin per day (live trading)
    max_calls_per_backtest: 1     # LLM call cap per coin per backtest
    enable_in_backtest: true      # Toggle LLM usage during backtests
    capital_multipliers:
      default: 1.0                # Base capital multiplier (starts at 1.0)
      per_signal_bonus: 0.15      # Additional multiplier per aligned BUY signal
      divergence: 0.2             # Additional multiplier when LLM triggered due to divergence
      confidence: 0.25            # Additional multiplier when LLM triggered via high confidence
      llm_confirmed: 0.3          # Additional multiplier when LLM returns strong confirmation
      oversold_trigger: 0.35      # Additional multiplier when oversold meme setup fires

  oversold:
    enabled: true
    rsi_period: 14
    rsi_threshold: 25
    bb_period: 20
    bb_std: 2.0
    volume_ema_period: 20
    sma_period: 200
    community_threshold: 10000
    base_confidence: 0.7
    max_confidence: 0.92
    capital_boost_multiplier: 1.35
    community_membership:
      TRUMP: 25000
      SHIB: 400000
      DOGE: 380000
      SOL: 150000
      ETH: 600000
  
  baseline:
    momentum_window: 5
    mean_reversion_threshold: 0.02
    momentum_weight: 0.6
    mean_reversion_weight: 0.4

trading:
  pairs: ["TRUMP/USD", "SHIB/USD", "DOGE/USD", "SOL/USD", "ETH/USD"]  # or "all" for all available pairs
  pair_weights:  # Weighting for position allocation (2:8 ratio)
    "TRUMP/USD": 70
    "SHIB/USD": 60
    "DOGE/USD": 70
    "SOL/USD": 400
    "ETH/USD": 400
  order_type: "MARKET"  # or "LIMIT"
  # Spot-only execution and risk knobs
  spot_only: true
  # Sizing: prefer equity-based max per-position; fallback to position_size_pct
  max_position_pct: 0.03           # 3% of equity per position
  position_size_pct: 0.1           # fallback legacy: 10% per trade
  # Exposure and concurrency limits
  max_portfolio_exposure_pct: 0.30 # at most 30% of equity invested
  max_concurrent_positions: 2      # at most 2 simultaneous positions
  # Trading cadence and filters
  max_positions: 3
  polling_interval: 60  # seconds
  min_confidence: 0.5  # Minimum signal confidence to execute trade (lowered from 0.6 to increase trade frequency)
  cooldown_period: 600  # seconds between trades for same pair
  min_order_size: 1.0
  max_order_size: null  # null for no limit

data:
  sources: ["roostoo", "binance"]  # ["roostoo", "horus", "binance"]
  storage: "sqlite"
  data_retention_days: 30
  binance:
    enabled: true
    interval: "1h"
    limit: 200
    cache_seconds: 300
    rsi_period: 14
    sma_period: 20

social:
  x:
    enabled: true
    bearer_token: ${X_BEARER_TOKEN}
    requests_per_coin_per_day: 2  # Limit: 2 API calls per coin per day
    cache_ttl_hours: 12           # Reuse cached sentiment for 12 hours
    max_results: 25               # Tweets per fetch (max 100)
    cache_path: "data/social_cache.json"
    enable_in_backtest: false     # Skip X fetching during backtests
    max_calls_per_backtest: 1     # Backtest fetch cap when enabled
    coin_queries:
      TRUMP: "(#TrumpCoin OR $TRUMP OR \"Trump\" (\"token\" OR \"coin\")) lang:en -is:retweet"
      SHIB: "(#ShibaInu OR $SHIB OR #SHIBAINU) lang:en -is:retweet"
      SOL: "(#Solana OR $SOL) lang:en -is:retweet"
      ETH: "(#Ethereum OR $ETH) lang:en -is:retweet"
      DOGE: "(#DogeCoin OR $DOGE) lang:en -is:retweet"
    pair_mapping:
      "TRUMP/USD": "TRUMP"
      "SHIB/USD": "SHIB"
      "SOL/USD": "SOL"
      "ETH/USD": "ETH"
      "DOGE/USD": "DOGE"

backtest:
  enabled: true
  initial_balance: 50000.0
  default_start_days: 10  # Days to look back if start_date not specified
  output_file: "data/backtest_report.json"

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_size_mb: 100

